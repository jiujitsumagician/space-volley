<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SPACE VOLLEY</title>
<style>
  /* self-hosted fonts (offline, no CDN) */
  @font-face{font-family:'Orbitron';src:url('assets/fonts/Orbitron.ttf') format('truetype');font-weight:400 900;font-style:normal;font-display:swap;}
  @font-face{font-family:'Rajdhani';src:url('assets/fonts/Rajdhani-Regular.ttf') format('truetype');font-weight:400 500;font-style:normal;font-display:swap;}
  @font-face{font-family:'Rajdhani';src:url('assets/fonts/Rajdhani-SemiBold.ttf') format('truetype');font-weight:600;font-style:normal;font-display:swap;}
  @font-face{font-family:'Rajdhani';src:url('assets/fonts/Rajdhani-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap;}
  :root {
    /* SPACE VOLLEY runs an NSDF command-terminal UI — phosphor green chrome
       over the battle view. (These vars keep the old --amber* names so the
       whole menu/HUD recolours from one place; the value is green now.) */
    --amber: #38e070;        /* terminal green (primary UI accent) */
    --amber-hot: #86ffae;    /* bright phosphor green */
    --term: #38e070;
    --term-dim: #1c7a3e;
    --grid: rgba(80, 255, 150, 0.16);
    --grid-line: rgba(120, 255, 180, 0.5);
    --steel: #9fd9c4;
    --bg: #04070a;
    --danger: #ff4d4d;
    --ok: #6dff8a;
    --mono: "Consolas", "SFMono-Regular", ui-monospace, "Roboto Mono", monospace;
    /* Identity fonts: Orbitron = logo/display, Rajdhani = UI body. */
    --display: "Orbitron", "Consolas", ui-monospace, monospace;
    --ui: "Rajdhani", "Segoe UI", system-ui, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
  body { font-family: var(--ui); color: #d6f4e4; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  /* ── command-terminal screen frame (always on, above the battle) ──── */
  #hudframe {
    position: fixed; inset: 10px; pointer-events: none; z-index: 8;
    border: 1px solid var(--grid);
    border-radius: 6px;
    box-shadow: inset 0 0 60px rgba(40, 255, 120, 0.05);
  }
  #hudframe::before, #hudframe::after {
    content: ""; position: absolute; inset: 0;
    background:
      linear-gradient(var(--grid-line), var(--grid-line)) left 0 top 0/26px 2px no-repeat,
      linear-gradient(var(--grid-line), var(--grid-line)) left 0 top 0/2px 26px no-repeat,
      linear-gradient(var(--grid-line), var(--grid-line)) right 0 top 0/26px 2px no-repeat,
      linear-gradient(var(--grid-line), var(--grid-line)) right 0 top 0/2px 26px no-repeat,
      linear-gradient(var(--grid-line), var(--grid-line)) left 0 bottom 0/26px 2px no-repeat,
      linear-gradient(var(--grid-line), var(--grid-line)) left 0 bottom 0/2px 26px no-repeat,
      linear-gradient(var(--grid-line), var(--grid-line)) right 0 bottom 0/26px 2px no-repeat,
      linear-gradient(var(--grid-line), var(--grid-line)) right 0 bottom 0/2px 26px no-repeat;
    filter: drop-shadow(0 0 4px rgba(60, 255, 130, 0.6));
  }

  /* ── overlay layers ─────────────────────────────────────── */
  .layer { position: fixed; inset: 0; pointer-events: none; }
  .layer.interactive { pointer-events: auto; }

  /* split divider */
  #divider {
    position: fixed; left: 50%; top: 0; bottom: 0; width: 4px;
    transform: translateX(-2px);
    background: linear-gradient(#000, #2a3340 30%, #2a3340 70%, #000);
    box-shadow: 0 0 12px #000;
    display: none; z-index: 5;
  }

  /* ── menu chrome ────────────────────────────────────────── */
  #menu {
    display: flex; align-items: center; justify-content: center;
    /* Pad the viewport edges and allow the centred panel to scroll instead of
       clipping when a screen is taller than the window (the body itself is
       overflow:hidden, so without this the bottom buttons fell off-screen). */
    padding: 24px 16px;
    /* translucent so the live battle diorama shows behind the panel */
    background:
      radial-gradient(1100px 640px at 50% 8%, rgba(4,6,9,0) 34%, rgba(4,6,9,.62) 100%),
      linear-gradient(180deg, rgba(4,6,9,.42), rgba(4,6,9,0) 26%, rgba(4,6,9,.0) 64%, rgba(4,6,9,.66));
    z-index: 20;
  }
  .panel {
    position: relative;
    width: min(860px, 92vw);
    /* Never exceed the viewport — cap to the padded window height and scroll
       internally. dvh tracks mobile browser chrome so nothing hides under it. */
    max-height: calc(100dvh - 48px);
    overflow-y: auto;
    overflow-x: hidden;
    text-align: center;
    padding: 36px 44px 44px;
    /* terminal slab: dark green-tinted glass with a phosphor border + glow */
    background:
      linear-gradient(180deg, rgba(8,18,14,.93), rgba(4,11,9,.96));
    border: 1px solid rgba(80,255,150,.34);
    border-radius: 8px;
    box-shadow:
      0 30px 80px rgba(0,0,0,.6),
      0 0 38px rgba(40,255,120,.08),
      inset 0 0 0 1px rgba(80,255,150,.06);
    backdrop-filter: blur(6px);
  }
  /* inset second frame line (double-rule terminal look) */
  .panel::before {
    content: ""; position: absolute; inset: 7px; pointer-events: none;
    border: 1px solid rgba(80,255,150,.16); border-radius: 4px;
  }
  /* faint scanlines */
  .panel::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: 8px;
    background: repeating-linear-gradient(rgba(90,255,160,.045) 0 1px, transparent 1px 3px);
    mix-blend-mode: screen;
  }
  .panel > * { position: relative; }
  @media (max-width: 560px) {
    .panel { padding: 22px 18px 26px; }
    .choices { gap: 10px; }
  }
  .logo {
    font-family: var(--display);
    font-size: clamp(40px, 7.4vw, 76px);
    font-weight: 900;
    letter-spacing: .1em;
    line-height: .95;
    background: linear-gradient(180deg, #eafff2 0%, var(--amber-hot) 42%, var(--amber) 62%, #0e6e34 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 22px rgba(56,224,112,.45));
    text-transform: uppercase;
  }
  .tagline { margin-top: 8px; font-family: var(--mono); color: #6fcf9a; letter-spacing: .34em; font-size: 12px; text-transform: uppercase; }
  .menu-section { margin-top: 28px; }
  .menu-title { font-family: var(--mono); font-size: 12px; letter-spacing: .3em; color: var(--term); text-transform: uppercase; margin-bottom: 14px; text-shadow: 0 0 10px rgba(56,224,112,.4); }

  /* ── TITLE SCREEN: a polished military-sci-fi hero ──────────── */
  /* Marked on the title panel via .panel.title-screen (set from menu.js). */
  .panel.title-screen { padding-top: 30px; }
  .title-screen .logo {
    font-size: clamp(30px, 6vw, 62px);
    letter-spacing: .04em;
    line-height: .96;
    position: relative;
    max-width: 100%;
    animation: logoGlow 3.6s ease-in-out infinite;
  }
  @keyframes logoGlow {
    0%, 100% { filter: drop-shadow(0 0 18px rgba(56,224,112,.35)); }
    50%      { filter: drop-shadow(0 0 34px rgba(86,255,174,.62)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .title-screen .logo { animation: none; }
  }
  /* sweeping scan-glint across the logo */
  .title-screen .logo::after {
    content: ""; position: absolute; inset: -6% -4%;
    background: linear-gradient(115deg, transparent 38%, rgba(190,255,220,.5) 48%, transparent 58%);
    mix-blend-mode: screen; pointer-events: none;
    transform: translateX(-120%);
    animation: logoSweep 5.5s ease-in-out infinite;
  }
  @keyframes logoSweep {
    0%, 62% { transform: translateX(-120%); }
    78%     { transform: translateX(120%); }
    100%    { transform: translateX(120%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .title-screen .logo::after { animation: none; opacity: 0; }
  }
  /* call-sign rule under the logo */
  .title-screen .tagline {
    position: relative; display: inline-block; padding: 0 18px; margin-top: 12px;
  }
  .title-screen .tagline::before, .title-screen .tagline::after {
    content: ""; position: absolute; top: 50%; width: 46px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--term));
    box-shadow: 0 0 8px rgba(56,224,112,.6);
  }
  .title-screen .tagline::before { right: 100%; }
  .title-screen .tagline::after { left: 100%; transform: scaleX(-1); }
  /* status strip above the menu */
  .title-status {
    display: flex; gap: 16px; justify-content: center; flex-wrap: wrap;
    margin: 22px auto 4px; font-family: var(--mono); font-size: 10px;
    letter-spacing: .26em; text-transform: uppercase; color: #5fb98a;
  }
  .title-status span { display: inline-flex; align-items: center; gap: 7px; }
  .title-status span::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: var(--amber-hot); box-shadow: 0 0 8px var(--amber-hot);
    animation: statBlink 2.2s ease-in-out infinite;
  }
  @keyframes statBlink { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .title-status span::before { animation: none; } }
  /* drifting starfield / radar-sweep accents behind the title menu (CSS only) */
  .title-bg { position: absolute; inset: 0; overflow: hidden; pointer-events: none; border-radius: 8px; z-index: 0; }
  .title-bg::before {
    content: ""; position: absolute; inset: -40%;
    background:
      radial-gradient(1px 1px at 20% 30%, rgba(150,255,190,.7), transparent),
      radial-gradient(1px 1px at 70% 60%, rgba(120,255,170,.55), transparent),
      radial-gradient(1px 1px at 40% 80%, rgba(180,255,210,.5), transparent),
      radial-gradient(1px 1px at 85% 25%, rgba(120,255,170,.55), transparent),
      radial-gradient(1px 1px at 55% 15%, rgba(150,255,190,.6), transparent),
      radial-gradient(1px 1px at 10% 70%, rgba(120,255,170,.5), transparent);
    animation: starDrift 24s linear infinite;
    opacity: .5;
  }
  @keyframes starDrift { from { transform: translateY(0); } to { transform: translateY(8%); } }
  .title-bg::after {
    content: ""; position: absolute; left: 50%; top: 38%;
    width: 150%; aspect-ratio: 1; transform: translate(-50%, -50%);
    background: conic-gradient(from 0deg, rgba(56,224,112,.10) 0deg, transparent 38deg);
    animation: radarSweep 7s linear infinite;
  }
  @keyframes radarSweep { to { transform: translate(-50%, -50%) rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .title-bg::before, .title-bg::after { animation: none; } }
  .title-screen > * { position: relative; z-index: 1; }
  /* refined vertical menu cards on the title screen */
  .title-screen .choices.vstack { gap: 12px; max-width: 460px; }
  .title-screen .choices.vstack .choice {
    display: grid; grid-template-columns: auto 1fr auto; align-items: center;
    gap: 4px 16px; padding: 15px 20px;
    background: linear-gradient(100deg, rgba(14,30,22,.94), rgba(7,17,12,.96));
    transition: transform .14s ease, border-color .14s, box-shadow .14s, background .14s;
  }
  .title-screen .choice .glyph {
    grid-row: 1 / span 2; font-size: 22px; line-height: 1; width: 30px; text-align: center;
    filter: drop-shadow(0 0 6px rgba(56,224,112,.5));
  }
  .title-screen .choice .big {
    font-family: var(--display); font-weight: 700; font-size: 16px; letter-spacing: .08em;
  }
  .title-screen .choice .sub { grid-column: 2 / span 2; }
  .title-screen .choice .arrow {
    grid-row: 1 / span 2; font-family: var(--mono); color: var(--term);
    opacity: 0; transform: translateX(-6px); transition: opacity .14s, transform .14s;
  }
  .title-screen .choice:hover, .title-screen .choice.focus {
    background: linear-gradient(100deg, rgba(20,44,32,.96), rgba(9,22,16,.97));
  }
  .title-screen .choice:hover .arrow, .title-screen .choice.focus .arrow {
    opacity: 1; transform: translateX(0);
  }
  .choices { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  /* vertical menu stack (title screen) */
  .choices.vstack { flex-direction: column; align-items: stretch; flex-wrap: nowrap; max-width: 440px; margin: 0 auto; }
  .choices.vstack .choice { text-align: left; padding: 16px 22px; }
  /* controls reference table */
  .ctrl { margin: 6px auto 0; border-collapse: collapse; }
  .ctrl td, .ctrl th { padding: 7px 22px; border-bottom: 1px solid #232c38; font-size: 13px; text-align: left; }
  .ctrl th { font-size: 10px; letter-spacing: .22em; color: #76879a; text-transform: uppercase; }
  .ctrl td:first-child { color: #9fb0c2; }
  .ctrl td:not(:first-child) { color: #e8eef4; font-weight: 600; }
  .choice {
    min-width: 150px;
    padding: 14px 18px;
    border: 1px solid rgba(80,255,150,.18);
    border-radius: 8px;
    background: linear-gradient(180deg, rgba(14,28,21,.92), rgba(7,16,12,.95));
    color: #cfe8da;
    cursor: pointer;
    transition: transform .12s ease, border-color .12s, box-shadow .12s;
    user-select: none;
  }
  .choice .big { font-size: 17px; font-weight: 700; color: #e6fff0; }
  .choice .sub { font-size: 11px; color: #79a892; margin-top: 4px; letter-spacing: .04em; }
  .choice {
    font-family: var(--ui);
  }
  .choice:hover {
    transform: translateY(-2px);
    border-color: var(--amber);
    box-shadow: 0 6px 24px rgba(56,224,112,.2), inset 0 0 0 1px rgba(86,255,174,.28);
  }
  /* Gamepad / keyboard selection cursor. Deliberately much louder than :hover
     so it's always obvious which item the controller is on — a bright ring,
     a glow, and a pulse. Applies to menu cards, buttons and sliders alike,
     since the cursor can land on any of them. */
  .choice.focus, .btn.focus, input[type="range"].focus {
    outline: 3px solid var(--amber-hot);
    outline-offset: 3px;
    border-color: var(--amber-hot);
    box-shadow: 0 0 0 2px rgba(134,255,174,.55), 0 10px 34px rgba(56,224,112,.5);
    animation: focusPulse 1.1s ease-in-out infinite;
  }
  .choice.focus { transform: translateY(-2px) scale(1.02); }
  .btn.focus { transform: translateY(-2px) scale(1.03); }
  @keyframes focusPulse {
    0%, 100% { outline-color: var(--amber-hot); }
    50%      { outline-color: var(--amber); }
  }
  @media (prefers-reduced-motion: reduce) {
    .choice.focus, .btn.focus, input[type="range"].focus { animation: none; }
  }
  .choice.selected {
    border-color: var(--amber);
    background: linear-gradient(180deg, #0e2419, #07140d);
    box-shadow: inset 0 0 18px rgba(56,224,112,.18), 0 0 0 1px rgba(86,255,174,.38);
  }
  .choice.disabled { opacity: .35; pointer-events: none; }
  .choice img.thumb {
    display: block; width: 100%; height: 110px; object-fit: cover;
    border-radius: 8px; margin-bottom: 10px;
    border: 1px solid #2a3645;
    background: #0a0e14;
  }
  input[type="range"] {
    accent-color: var(--amber);
    cursor: pointer;
  }
  .row-actions { margin-top: 30px; display: flex; gap: 14px; justify-content: center; }
  .btn {
    padding: 14px 38px;
    font-family: var(--display);
    font-size: 14px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
    color: #042210;
    background: linear-gradient(180deg, var(--amber-hot), var(--amber) 60%, #0f8a42);
    border: none; border-radius: 8px; cursor: pointer;
    box-shadow: 0 8px 26px rgba(56,224,112,.35), inset 0 1px 0 rgba(220,255,235,.5);
    transition: transform .12s, filter .12s;
  }
  .btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
  .btn.ghost {
    color: #bfe8d2; background: transparent;
    border: 1px solid rgba(80,255,150,.3); box-shadow: none;
  }
  .hint { margin-top: 22px; font-size: 11px; color: #5d6e80; letter-spacing: .08em; }
  kbd {
    background: #1a2230; border: 1px solid #2e3a4a; border-bottom-width: 3px;
    border-radius: 5px; padding: 1px 7px; font-family: inherit; font-size: 10px; color: #aebdca;
  }

  /* ── HUD ────────────────────────────────────────────────── */
  .hud { position: absolute; inset: 0; pointer-events: none; z-index: 4; display: none; }
  .hud .corner { position: absolute; }
  .hpwrap { width: 220px; }
  .label { font-family: var(--mono); font-size: 10px; letter-spacing: .25em; color: #6fcf9a; text-transform: uppercase; text-shadow: 0 0 8px rgba(56,224,112,.4), 0 1px 3px #000; }
  .bar {
    height: 14px; margin-top: 4px; border-radius: 7px; overflow: hidden;
    background: rgba(8,12,18,.7); border: 1px solid rgba(170,190,210,.25);
    box-shadow: 0 2px 8px rgba(0,0,0,.5);
  }
  .bar > i {
    display: block; height: 100%; width: 100%;
    background: linear-gradient(90deg, #57e389, #b7f06e);
    transition: width .15s ease, background .2s;
  }
  .bar.low > i { background: linear-gradient(90deg, #ff5e5e, #ffb02e); }
  .ammo { display: flex; gap: 10px; margin-top: 10px; }
  .slot {
    min-width: 86px; padding: 7px 10px; border-radius: 10px;
    background: rgba(8,12,18,.72); border: 1px solid rgba(170,190,210,.22);
    text-shadow: 0 1px 3px #000;
  }
  .slot .k { font-size: 9px; letter-spacing: .2em; color: #8fa1b3; text-transform: uppercase; }
  .slot .v { font-size: 16px; font-weight: 800; color: #f3f7fb; }
  .slot.special { border-color: rgba(255,180,80,.55); box-shadow: 0 0 14px rgba(255,150,50,.25); }
  .slot.special .v { color: var(--amber-hot); }
  .slot .cd { height: 3px; background: #2a3645; border-radius: 2px; margin-top: 5px; overflow: hidden; }
  .slot .cd > i { display: block; height: 100%; width: 0%; background: var(--amber); }
  .reticle {
    position: absolute; left: 50%; top: 50%; width: 26px; height: 26px;
    transform: translate(-50%, -50%);
    opacity: .9; filter: drop-shadow(0 1px 2px #000);
  }
  .killfeed { position: absolute; right: 16px; top: 14px; text-align: right; font-size: 12px; }
  .killfeed div {
    margin-top: 4px; padding: 4px 10px; border-radius: 8px;
    background: rgba(8,12,18,.65); border: 1px solid rgba(170,190,210,.15);
    animation: feedin .25s ease;
  }
  .killfeed b { color: var(--amber-hot); }
  @keyframes feedin { from { transform: translateX(20px); opacity: 0; } }
  .scorepill {
    position: absolute; left: 50%; top: 12px; transform: translateX(-50%);
    padding: 6px 18px; border-radius: 6px; font-family: var(--mono); font-weight: 800; font-size: 14px;
    background: rgba(6,16,12,.72); border: 1px solid rgba(80,255,150,.32);
    color: #cdf6dd; letter-spacing: .12em; text-shadow: 0 0 10px rgba(56,224,112,.4), 0 1px 3px #000;
    box-shadow: 0 0 18px rgba(40,255,120,.1);
  }
  .toast {
    position: absolute; left: 50%; top: 24%; transform: translateX(-50%);
    font-family: var(--mono);
    font-size: 22px; font-weight: 900; letter-spacing: .2em; text-transform: uppercase;
    color: var(--amber-hot); text-shadow: 0 0 18px rgba(56,224,112,.7), 0 2px 4px #000;
    opacity: 0; transition: opacity .2s;
  }
  .minimap {
    position: absolute; right: 16px; bottom: 14px;
    width: 170px; height: 170px; border-radius: 12px;
    background: rgba(8,14,12,.62);
    border: 1px solid rgba(120,170,140,.35);
    box-shadow: 0 4px 18px rgba(0,0,0,.5), inset 0 0 24px rgba(40,90,60,.18);
    overflow: hidden;
  }
  .minimap canvas { display: block; width: 170px; height: 170px; }
  .mm-label {
    position: absolute; left: 8px; top: 6px; font-size: 9px; letter-spacing: .28em;
    color: rgba(150,210,170,.7); text-transform: uppercase; text-shadow: 0 1px 2px #000;
  }
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 58%, rgba(0,0,0,.42) 100%);
  }
  .dmgflash { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 40%, rgba(255,30,30,.35)); opacity: 0; }

  /* end screen */
  #endscreen { display: none; align-items: center; justify-content: center; z-index: 30;
    background: rgba(4,6,9,.78); backdrop-filter: blur(4px); }
  .endtitle { font-size: clamp(40px, 7vw, 72px); font-weight: 900; letter-spacing: .1em;
    background: linear-gradient(180deg, #fff, var(--amber)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .endsub { color: #9fb0c2; margin-top: 8px; letter-spacing: .2em; font-size: 13px; text-transform: uppercase; }
  .scores { margin: 26px auto 0; border-collapse: collapse; min-width: 380px; }
  .scores td, .scores th { padding: 8px 22px; border-bottom: 1px solid #232c38; font-size: 14px; }
  .scores th { font-size: 10px; letter-spacing: .25em; color: #76879a; text-transform: uppercase; }
  .scores .me { color: var(--amber-hot); font-weight: 800; }

  #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .4s ease; z-index: 50; }
</style>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <div id="app"></div>
  <div id="divider"></div>
  <div id="hudframe"></div>

  <div id="hud1" class="hud"></div>
  <div id="hud2" class="hud"></div>

  <div id="menu" class="layer interactive"></div>
  <div id="endscreen" class="layer interactive"></div>
  <div id="fade"></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
